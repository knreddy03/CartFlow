name: Backend CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cartflow_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cartflow_test
      FRONTEND_URL: http://localhost:5173
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      EMAIL_VERIFICATION_TOKEN_EXPIRE_MINUTES: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartflow_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d cartflow_db \
            -c "CREATE DATABASE cartflow_test;"

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cartflow_test
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: uv run pytest
